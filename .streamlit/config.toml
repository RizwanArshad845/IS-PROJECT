[theme]
base = "light"
primaryColor = "#2F4B9A"
backgroundColor = "#EEF1F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2430"

[server]
address = "localhost"   # only reachable from this computer

[client]
toolbarMode = "minimal"   # hide the developer "Deploy" toolbar

[browser]
gatherUsageStats = false
